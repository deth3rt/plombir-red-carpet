<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ПLОМБИР : Life</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #09090b;
            --card-bg: rgba(24, 24, 27, 0.9);
            --border: rgba(255, 255, 255, 0.1);
            --gold: #fcd34d;
            --gold-dark: #d97706;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --green: #22c55e;
            --red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-bottom: 75px;
        }

        .navbar {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            height: 65px;
            background: rgba(14, 14, 17, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            background: none;
            border: none;
            flex: 1;
            padding: 8px 0;
            transition: color 0.2s;
        }

        .nav-item.active { color: var(--gold); }
        .nav-item svg { width: 22px; height: 22px; margin-bottom: 4px; fill: currentColor; }

        .app-screen { display: none; flex: 1; padding: 16px; }
        .app-screen.active { display: block; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .btn {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: #000;
            font-weight: 900;
            border: none;
            border-radius: 14px;
            padding: 12px 20px;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(252, 211, 77, 0.3);
            text-transform: uppercase;
        }
        .btn:active { transform: scale(0.97); }
        .btn-secondary { background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid var(--border); box-shadow: none; }

        .profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
        .avatar {
            width: 65px; height: 65px; border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--red));
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; font-weight: 900; color: #000; border: 2px solid var(--gold); flex-shrink: 0;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; box-shadow: 0 0 8px var(--green); }

        .user-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .user-row:last-child { border-bottom: none; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-avatar {
            width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center; font-weight: 700; border: 1px solid var(--border);
        }

        .chat-container { display: flex; flex-direction: column; height: calc(100vh - 190px); }
        .messages-box {
            flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px;
            background: rgba(0,0,0,0.3); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 12px;
        }
        .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
        .msg-bubble.incoming { background: rgba(255,255,255,0.08); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-bubble.outgoing { background: var(--gold); color: #000; align-self: flex-end; border-bottom-right-radius: 4px; font-weight: 600; }

        .chat-input-row { display: flex; gap: 8px; }
        .chat-input-row input {
            flex: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: #fff; outline: none; font-size: 0.95rem;
        }
        .chat-input-row input:focus { border-color: var(--gold); }

        .canvas-wrap {
            position: relative; width: 100%; height: 240px; background: #ffffff; border-radius: 16px; overflow: hidden; border: 2px solid var(--gold); margin-bottom: 12px;
        }
        #drawCanvas { width: 100%; height: 100%; touch-action: none; display: block; cursor: crosshair; }
        .tools-row { display: flex; gap: 10px; margin-bottom: 12px; justify-content: center; align-items: center; }
        .color-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
        .badge-online { font-size: 0.7rem; color: var(--green); background: rgba(34, 197, 94, 0.15); padding: 3px 8px; border-radius: 8px; border: 1px solid rgba(34, 197, 94, 0.3); font-weight: 700; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ПРОФИЛЬ -->
    <div id="screen-profile" class="app-screen active">
        <div class="card">
            <div class="profile-header">
                <div class="avatar" id="myAvatarLetter">П</div>
                <div>
                    <h2 id="myName" style="color: var(--gold); font-size: 1.2rem; margin-bottom: 4px;">Павел Цейко</h2>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span class="status-dot"></span>
                        <span style="font-size: 0.8rem; color: var(--text-muted);">В сети • ID: <span id="myId">---</span></span>
                    </div>
                </div>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px;">
                Статус: <strong style="color: #fff;" id="myBio">ПLОМБИР: RED CARPET 🔥</strong>
            </div>
            <button class="btn btn-secondary" onclick="editBio()">Изменить статус ✍️</button>
        </div>
    </div>

    <!-- ЭКРАН 2: ДРУЗЬЯ (Динамический список из БД) -->
    <div id="screen-friends" class="app-screen">
        <div class="card">
            <h3 style="font-size: 1.1rem; color: var(--gold); margin-bottom: 12px;">🤝 Участники тусовки</h3>
            <div id="friendsList">
                <p style="color: var(--text-muted); font-size: 0.85rem;">Загрузка участников из базы...</p>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 3: ЧАТЫ -->
    <div id="screen-chats" class="app-screen">
        <div class="card" style="margin-bottom: 10px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;">
            <h3 style="font-size: 1rem; color: var(--gold);">💬 Общий чат #PLMBR</h3>
            <button class="btn" style="width: auto; padding: 6px 12px; font-size: 0.75rem;" onclick="fetchData()">🔄 Обновить</button>
        </div>
        <div class="chat-container">
            <div class="messages-box" id="globalChatBox">
                <div class="msg-bubble incoming"><strong>Система:</strong> Синхронизация с таблицей...</div>
            </div>
            <div class="chat-input-row">
                <input type="text" id="globalMsgInput" placeholder="Написать сообщение..." maxlength="200" onkeypress="if(event.key === 'Enter') sendGlobalMessage()">
                <button class="btn" style="width: auto; padding: 0 16px;" onclick="sendGlobalMessage()">➤</button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 4: КРОКОДИЛ (Рабочий холст) -->
    <div id="screen-crocodile" class="app-screen">
        <div class="card" style="display:flex; flex-direction:column; align-items:center;">
            <h3 style="color: var(--gold); margin-bottom: 4px; font-size: 1.1rem;">🐊 Арт-Крокодил</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px; text-align: center;">Рисуй пальцем или мышкой прямо на холсте!</p>
            
            <div class="canvas-wrap">
                <canvas id="drawCanvas"></canvas>
            </div>

            <div class="tools-row">
                <div class="color-btn" style="background:#000;" onclick="setDrawColor('#000')"></div>
                <div class="color-btn" style="background:#ef4444;" onclick="setDrawColor('#ef4444')"></div>
                <div class="color-btn" style="background:#22c55e;" onclick="setDrawColor('#22c55e')"></div>
                <div class="color-btn" style="background:#3b82f6;" onclick="setDrawColor('#3b82f6')"></div>
                <button class="btn btn-secondary" style="width:auto; padding:8px 14px; font-size:0.75rem;" onclick="clearCanvas()">Очистить</button>
            </div>

            <div class="chat-input-row" style="width:100%;">
                <input type="text" id="guessInput" placeholder="Вариант ответа..." maxlength="30">
                <button class="btn" style="width: auto; padding: 0 14px;" onclick="submitGuess()">Отправить</button>
            </div>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <nav class="navbar">
        <button class="nav-item active" onclick="switchTab('profile', this)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Профиль
        </button>
        <button class="nav-item" onclick="switchTab('friends', this)">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-2S17.66 7 16 7c-1.66 0-3 1.34-3 2s1.34 2 3 2zm-8 0c1.66 0 2.99-1.34 2.99-2S9.66 7 8 7C6.34 7 5 8.34 5 10s1.34 2 3 2zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            Друзья
        </button>
        <button class="nav-item" onclick="switchTab('chats', this)">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
            Чаты
        </button>
        <button class="nav-item" onclick="switchTab('crocodile', this)">
            <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-4c-.83 0-1.5-.67-1.5-1.5S17.67 8 18.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            Игра
        </button>
    </nav>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbww3qW0u86gmBc0grmY_LlvU-mhXCHpImdSPFRBhO8DvBB-bBV9-U03b51OY-osPb0E/exec";

        let tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        let currentUser = {
            id: tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "777777",
            first_name: tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : "Павел",
            bio: "ПLОМБИР: RED CARPET 🔥"
        };

        function initApp() {
            document.getElementById('myName').textContent = currentUser.first_name;
            document.getElementById('myId').textContent = currentUser.id;
            document.getElementById('myAvatarLetter').textContent = currentUser.first_name.charAt(0).toUpperCase();
            document.getElementById('myBio').textContent = currentUser.bio;
            
            initCrocodile();
            fetchData();
            setInterval(fetchData, 5000);
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.navbar button').forEach(b => b.classList.remove('active'));
            document.getElementById('screen-' + tabId).classList.add('active');
            btn.classList.add('active');
        }

        function editBio() {
            let newBio = prompt("Введите новый статус:", currentUser.bio);
            if (newBio) {
                currentUser.bio = newBio;
                document.getElementById('myBio').textContent = newBio;
            }
        }

        // Синхронизация с Google Таблицей (Сообщения + Пользователи)
        async function fetchData() {
            if (!SCRIPT_URL.startsWith("http")) return;
            try {
                let res = await fetch(SCRIPT_URL);
                let data = await res.json();
                if (data.status === "ok") {
                    renderMessages(data.messages || []);
                    renderUsers(data.users || []);
                }
            } catch(e) {
                console.error("Ошибка синхронизации:", e);
            }
        }

        async function sendGlobalMessage() {
            const input = document.getElementById('globalMsgInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = "";
            
            // Локальный предпросмотр сообщения
            const box = document.getElementById('globalChatBox');
            box.innerHTML += `<div class="msg-bubble outgoing"><strong>${currentUser.first_name}:</strong> ${text}</div>`;
            box.scrollTop = box.scrollHeight;

            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ author: currentUser.first_name, text: text })
                });
                setTimeout(fetchData, 1000);
            } catch(e) {
                console.error("Ошибка отправки:", e);
            }
        }

        function renderMessages(msgs) {
            const box = document.getElementById('globalChatBox');
            if (msgs.length === 0) {
                box.innerHTML = `<div class="msg-bubble incoming"><strong>Система:</strong> Чат пуст. Напиши первое сообщение!</div>`;
                return;
            }
            box.innerHTML = msgs.map(m => {
                let isMine = m.author === currentUser.first_name;
                return `<div class="msg-bubble ${isMine ? 'outgoing' : 'incoming'}"><strong>${m.author}:</strong> ${m.text}</div>`;
            }).join('');
            box.scrollTop = box.scrollHeight;
        }

        function renderUsers(users) {
            const list = document.getElementById('friendsList');
            if (users.length === 0) {
                list.innerHTML = `<p style="color: var(--text-muted); font-size: 0.85rem;">Пока нет активных участников в базе.</p>`;
                return;
            }
            list.innerHTML = users.map(u => `
                <div class="user-row">
                    <div class="user-info">
                        <div class="user-avatar">${u.name.charAt(0).toUpperCase()}</div>
                        <div>
                            <div style="font-weight: 700; font-size: 0.9rem;">${u.name}</div>
                            <div style="font-size: 0.7rem; color:var(--text-muted);">Активен: ${u.lastSeen}</div>
                        </div>
                    </div>
                    <span class="badge-online">В сети</span>
                </div>
            `).join('');
        }

        // РАБОЧИЙ ХОЛСТ (КРОКОДИЛ)
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;
        let currentColor = '#000';

        function initCrocodile() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = 240;
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function setDrawColor(col) { currentColor = col; }
        
        function clearCanvas() {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function startPos(e) {
            painting = true;
            draw(e);
        }

        function stopPos() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting) return;
            e.preventDefault();

            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.strokeStyle = currentColor;

            let rect = canvas.getBoundingClientRect();
            let clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            let clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

            let x = clientX - rect.left;
            let y = clientY - rect.top;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', startPos);
        canvas.addEventListener('mouseup', stopPos);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', startPos, { passive: false });
        canvas.addEventListener('touchend', stopPos);
        canvas.addEventListener('touchmove', draw, { passive: false });

        function submitGuess() {
            const input = document.getElementById('guessInput');
            if (input.value.trim()) {
                alert(`Ответ "${input.value}" принят!`);
                input.value = "";
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
